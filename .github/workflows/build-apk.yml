name: Build Hermes Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_NAME: "0.3.0"
  # 签名凭据只从 Secrets / 环境变量注入，源码里不再写死密码。
  # 未配置 Secrets 时回退到随仓库分发的自签名凭据，保证历史构建链不中断；
  # 正式分发前请在仓库 Settings -> Secrets 配置同名项并更换 keystore。
  HERMES_STORE_PASSWORD: ${{ secrets.HERMES_STORE_PASSWORD || 'hermes2026' }}
  HERMES_KEY_PASSWORD: ${{ secrets.HERMES_KEY_PASSWORD || 'hermes2026' }}
  HERMES_KEY_ALIAS: ${{ secrets.HERMES_KEY_ALIAS || 'hermes' }}

jobs:
  # 真正的 arm64 机器上跑一次容器内冒烟测试：解包、导入 Hermes、起面板、
  # 访问首页。qemu 模拟只能证明「文件齐全」，这个 job 证明「真的能跑」。
  verify-runtime:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Unpack runtime
        run: |
          mkdir -p /tmp/rootfs
          tar xzf android/app/src/main/assets/hermes-rootfs-arm64.tar.gz -C /tmp/rootfs
          ls /tmp/rootfs/opt/hermes

      - name: Mount pseudo filesystems
        run: |
          sudo mkdir -p /tmp/rootfs/proc /tmp/rootfs/dev /tmp/rootfs/sys /tmp/rootfs/tmp
          sudo mount --bind /proc /tmp/rootfs/proc
          sudo mount --bind /dev /tmp/rootfs/dev
          sudo mount --bind /sys /tmp/rootfs/sys

      - name: Import smoke test
        run: |
          sudo chroot /tmp/rootfs /bin/bash -c \
            'HERMES_HOME=/root/.hermes PYTHONPATH=/opt/hermes/lib /usr/bin/python3.12 -c "import fastapi, uvicorn, hermes_cli.main; print(\"import ok\")"'

      - name: Boot dashboard and probe
        run: |
          sudo chroot /tmp/rootfs /bin/bash -c \
            'cd /root && HERMES_HOME=/root/.hermes PYTHONPATH=/opt/hermes/lib PYTHONUNBUFFERED=1 /usr/bin/python3.12 -u -m hermes_cli.main dashboard --port 9119 --skip-build --no-open > /tmp/boot.log 2>&1 &'
          for i in $(seq 1 40); do
            sleep 5
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:9119/ || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then
              curl -s http://127.0.0.1:9119/ | head -c 300
              echo
              echo "dashboard ok"
              exit 0
            fi
          done
          echo "--- boot log ---"
          sudo cat /tmp/rootfs/tmp/boot.log || true
          exit 1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK" > android/local.properties
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          ls "$SDK/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Show Gradle
        run: gradle --version | head -5

      - name: Build release APK
        run: |
          cd android
          gradle :app:assembleRelease --no-daemon

      - name: Name release APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/Hermes-Agent-Android-${{ env.VERSION_NAME }}.apk

      - name: Checksum and fingerprint
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          sha256sum "$APK"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^package"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"


      - uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-v1
          name: Hermes Agent Android runtime
          body: |
            Hermes Agent 安卓版 ${{ env.VERSION_NAME }}（内置 Ubuntu 根环境 + Python 3.12）。

            这一版是 3.0：主屏换成 Today 那种原生手机 App，不再是网页套壳。
            - 全屏渐变、圆形按钮与头像、白色聊天气泡流、胶囊输入栏、胶囊底部 5 Tab、卡片式设置页
            - 首屏纯原生 View，WebView 工作台按需加载；输入框内容可送进 /chat 终端
            - 删除 2 秒轮询注入、精简 CSS 通配选择器，解决卡顿
            - 2.0 的文件选择 / 多选上传 / 下载落盘 / 原生工作区 / 全部设置入口保留
            - 完整上游面板一个页面不少，工作台左上「←」可随时回到首页

            签名与 1.0 完全一致，可直接覆盖安装，面板数据与设置不会丢。
            仅支持 arm64-v8a；首次启动需解压运行环境，约 1–3 分钟。
          
          files: |
            android/app/build/outputs/apk/release/Hermes-Agent-Android-${{ env.VERSION_NAME }}.apk
            android/app/src/main/assets/hermes-rootfs-arm64.tar.gz
          fail_on_unmatched_files: false

